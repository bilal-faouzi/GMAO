{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
  <div class="content">
    <h1>Restaurer un backup</h1>
    <p>Chargez un fichier JSON généré par la sauvegarde pour restaurer la base.</p>

    {% if error %}
      <p class="errornote">{{ error }}</p>
    {% endif %}
    {% if success %}
      <p class="success">{{ success }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data" style="margin-top: 16px;">
      {% csrf_token %}
      <input type="file" name="backup_file" accept="application/json" required />
      <div style="margin-top: 12px;">
        <input type="submit" value="Restaurer le backup" class="default" />
      </div>
    </form>
  </div>
{% endblock %}
